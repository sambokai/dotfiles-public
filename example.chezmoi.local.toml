# Copy this file to ~/.config/chezmoi/chezmoi.local.toml
# and fill in your own values. It is never committed to git.
#
# `name` and `email` are required. `gitSigningKey` is optional —
# when set, git commit/tag signing is enabled with that SSH key.

[data]
    name = "Your Name"
    email = "you@example.com"
    # gitSigningKey = "ssh-ed25519 AAAA..."
